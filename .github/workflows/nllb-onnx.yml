# Exports Meta's NLLB-200 translators to ONNX (fp16 weights) for DirectML - the translator
# on any graphics card on Windows - checks them against the CTranslate2 models the app uses,
# and publishes them as the release "models-nllb-onnx-1". The setup downloads them from
# there (src/nllb_onnx.py). NLLB-200 is © Meta, CC-BY-NC 4.0.
name: NLLB for DirectML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/nllb-onnx.yml", "tools/nllb_onnx_export.py"]

permissions:
  contents: write

env:
  TAG: models-nllb-onnx-1

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        model: [nllb-200-distilled-600M, nllb-200-distilled-1.3B]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk space, add swap (the 1.3B model needs more than the 16 GB RAM)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h; df -h /
      - name: Tools
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1+cpu" "transformers==4.46.3" "onnx==1.17.0" \
            "onnxruntime==1.20.1" "onnxconverter-common==1.14.0" sentencepiece protobuf \
            "ctranslate2>=4.4" huggingface_hub "numpy<2.3"
          python -c "import torch, transformers; print(torch.__version__, transformers.__version__)"
      - name: Export to ONNX (fp16)
        run: |
          python tools/nllb_onnx_export.py export "${{ matrix.model }}" out
          rm -rf ~/.cache/huggingface/hub/models--facebook--*
          ls -la out
      - name: Check against the CTranslate2 model
        timeout-minutes: 75
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: python tools/nllb_onnx_export.py check "${{ matrix.model }}" out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "NLLB translators for DirectML" \
              --notes "Meta's NLLB-200 translators exported to ONNX (fp16) for the translator on any graphics card on Windows (DirectML). Made by .github/workflows/nllb-onnx.yml. NLLB-200 © Meta, licensed CC-BY-NC 4.0 (https://github.com/facebookresearch/fairseq/tree/nllb)."
          for f in encoder_model.onnx decoder_model_merged.onnx config.json; do
            cp "out/$f" "${{ matrix.model }}-$f"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${{ matrix.model }}-$f"
          done
