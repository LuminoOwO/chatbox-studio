# Builds every package and publishes a release when a version tag (v1.30, ...) is pushed:
# Windows setup .exe + ZIP, Linux ZIP, .deb, .rpm and the Arch package.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y nsis rpm libarchive-tools zstd
      - name: Check the code
        run: python3 -m compileall -q src build_release.py
      - name: Build packages
        run: python3 build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          # this version's part of the changelog as release notes
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{if(f)exit} f' docs/CHANGELOG.md > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Chatbox Studio $VER" --notes-file notes.md
          gh release upload "$TAG" --clobber dist/*
