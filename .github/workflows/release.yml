# Builds every package and publishes the release "v<version>" (Windows setup .exe + ZIP,
# Linux ZIP, .deb, .rpm and the Arch package). Runs when the version in src/version.py
# changes on main (the release and its tag are created here), on a pushed v* tag, or by hand.
name: Release

on:
  push:
    branches: [main]
    paths: ["src/version.py", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Builds on your own PC (RunnerDock; Linux Mint 22 has the same base as ubuntu-24.04). Set the
    # repository variable USE_MY_PC to false to build on GitHub's runners instead.
    runs-on: ${{ vars.USE_MY_PC != 'false' && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Packaging tools
        run: |
          PKGS="nsis rpm libarchive-tools zstd"
          MISSING=$(for p in $PKGS; do dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "ok installed" || printf '%s ' "$p"; done)
          MISSING=${MISSING% }
          if [ -z "$MISSING" ]; then echo "All system libraries present"; exit 0; fi
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # no sudo on your own PC: install them once yourself
            echo "::error::Missing on this machine: $MISSING. Run once: sudo apt install $MISSING"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y $MISSING
      - name: Check the code
        run: python3 -m compileall -q src build_release.py
      - name: Build packages
        run: python3 build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^__version__ *= *"\(.*\)"/\1/p' src/version.py)
          TAG="v${VER}"
          # this version's part of the changelog as release notes
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{if(f)exit} f' docs/CHANGELOG.md > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Chatbox Studio $VER" \
              --notes-file notes.md --latest
          gh release upload "$TAG" --clobber dist/*
